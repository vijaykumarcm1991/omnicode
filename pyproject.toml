[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "omnicode"
version = "1.0.0"
description = "OpenAI API Compatible Autonomous Coding Agent CLI (Claude Code & Antigravity alternative)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "OmniCode Team" }
]
dependencies = [
    "openai>=1.50.0",
    "rich>=13.7.0",
    "prompt_toolkit>=3.0.40",
    "click>=8.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.27.0",
    "tiktoken>=0.7.0",
    "pyyaml>=6.0",
    "pathspec>=0.12.0",
    "beautifulsoup4>=4.12.0"
]

[project.scripts]
omnicode = "omnicode.cli:main"
omni = "omnicode.cli:main"
